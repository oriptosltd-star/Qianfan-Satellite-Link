plugins {
    id "com.android.application"
}

android {
    namespace "com.qianfan.satellitelink"
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("C:/Users/terry/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.qianfan.satellitelink"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
